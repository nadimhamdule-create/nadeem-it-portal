<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Administration</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#eef6ff,#f8f5ff,#fff8ef);color:#172033}.wrap{max-width:1180px;margin:auto;padding:30px}.head{background:linear-gradient(120deg,#0f2b62,#5b21b6,#be185d);padding:26px;border-radius:22px;color:#fff;box-shadow:0 18px 40px rgba(60,50,130,.2)}h1{margin:0}.head p{color:#e8e8ff}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.btn,button{border:0;border-radius:11px;padding:10px 13px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:800;cursor:pointer;text-decoration:none}.btn.secondary{background:#fff;color:#334155;border:1px solid #d9e2ef}.grid{display:grid;grid-template-columns:380px 1fr;gap:18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;box-shadow:0 10px 25px rgba(35,50,95,.07)}label{display:block;font-size:12px;font-weight:800;margin:12px 0 5px;color:#475569}input,select{width:100%;padding:11px 12px;border:1px solid #d7e0ec;border-radius:10px}.users{display:grid;gap:10px}.user{padding:13px;border:1px solid #e2e8f0;border-radius:13px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.meta{color:#64748b;font-size:12px;margin-top:4px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:7px 9px;font-size:11px}.danger{background:#be123c}.warn{background:#b45309}.ok{background:#047857}.msg{margin-top:12px;padding:10px;border-radius:10px;display:none}.msg.on{display:block;background:#eefcf7;border:1px solid #bbefd9;color:#14634b}.msg.err{display:block;background:#fff1f2;border:1px solid #fecdd3;color:#9f1239}@media(max-width:820px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="head"><h1>🔐 Portal User Administration</h1><p>Create engineer accounts, reset passwords and control portal access. API key setup remains administrator-only.</p></section><div class="bar"><a class="btn secondary" href="/">← Dashboard</a><a class="btn secondary" href="/agent-setup.html">✨ Agent Setup</a><button onclick="logout()">Sign Out</button></div><div class="grid"><section class="card"><h2>Create User</h2><label>Username</label><input id="newUser" placeholder="engineer01"><label>Temporary Password</label><input id="newPass" type="password" placeholder="Minimum 10 characters"><label>Role</label><select id="newRole"><option value="user">User / Engineer</option><option value="admin">Administrator</option></select><button style="width:100%;margin-top:15px" onclick="createUser()">Create Account</button><div id="msg" class="msg"></div></section><section class="card"><h2>Existing Users</h2><div id="users" class="users">Loading…</div></section></div></div><script>
const msg=(t,e=false)=>{let x=document.getElementById('msg');x.className='msg '+(e?'err':'on');x.textContent=t};
async function api(url,opt={}){let r=await fetch(url,opt);let j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function load(){try{let me=await api('/api/me');if(me.role!=='admin')location.href='/';let j=await api('/api/admin/users');users.innerHTML=j.users.map(u=>`<div class="user"><div><b>${esc(u.username)}</b><div class="meta">Role: ${u.role} • ${u.enabled?'Enabled':'Disabled'}${u.lastLogin?' • Last login: '+new Date(u.lastLogin).toLocaleString():''}</div></div><div class="actions"><button class="${u.enabled?'warn':'ok'}" onclick="toggleUser('${js(u.username)}',${!u.enabled})">${u.enabled?'Disable':'Enable'}</button><button onclick="resetPass('${js(u.username)}')">Reset Password</button></div></div>`).join('')}catch(e){document.body.innerHTML='<p style="padding:30px">'+esc(e.message)+'</p>'}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function js(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
async function createUser(){try{let j=await api('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:newUser.value,password:newPass.value,role:newRole.value})});msg(j.message);newUser.value='';newPass.value='';load()}catch(e){msg(e.message,true)}}
async function toggleUser(username,enabled){try{let j=await api('/api/admin/user-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,enabled})});msg(j.message);load()}catch(e){msg(e.message,true)}}
async function resetPass(username){let p=prompt('Enter a new password for '+username+' (minimum 10 characters):');if(!p)return;try{let j=await api('/api/admin/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password:p})});msg(j.message)}catch(e){msg(e.message,true)}}
async function logout(){await fetch('/api/logout',{method:'POST'});location.href='/login.html'}load();
</script></body></html>
