<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interview Practice</title><style>body{font-family:Segoe UI,Arial;margin:0;background:#f3f6ff;color:#172033}.wrap{max-width:900px;margin:auto;padding:25px}.hero{background:linear-gradient(135deg,#172554,#7c2d6f);color:white;padding:25px;border-radius:20px}.card{background:white;padding:20px;margin-top:16px;border:1px solid #dbe3ef;border-radius:16px}textarea,select{width:100%;padding:11px;margin:8px 0;border:1px solid #cbd5e1;border-radius:10px}textarea{min-height:130px}button{padding:10px 13px;margin:5px;border:0;border-radius:9px;background:#4f46e5;color:white;font-weight:bold}.answer{padding:14px;background:#eefcf7;border-left:4px solid #22c55e;display:none}.score{float:right;background:#eef2ff;padding:8px;border-radius:20px}a{color:#4338ca}</style></head><body><div class="wrap"><p><a href="index.html">← Dashboard</a> · <a href="troubleshooting-wizard.html">Wizard</a></p><div class="hero"><h1>🎯 Interview Practice Mode</h1><p>Answer like a senior escalation engineer: scope, evidence, safe action and verification.</p></div><div class="card"><span class="score">Score: <b id="points">0</b>/<b id="attempts">0</b></span><select id="cat"><option>All</option><option>Windows</option><option>Microsoft 365</option><option>Active Directory</option><option>VMware</option><option>Networking</option></select><h2 id="q"></h2><textarea placeholder="Type your answer before revealing..."></textarea><button id="show">Reveal Strong Answer</button><button id="next">Next</button><div id="ans" class="answer"></div><div id="rate"></div></div></div><script>const Q=[['Windows','PC suddenly became very slow. How will you troubleshoot?','Confirm scope and change history. Measure CPU, RAM, disk and top process. Check free space, Reliability Monitor and Event Viewer. Compare a working PC, fix the evidenced cause and repeat the user workflow.'],['Microsoft 365','User is not receiving an external email.','Collect sender, recipient, subject and timestamp. Check Service Health and Message Trace. Follow Delivered, Failed or Quarantined result; check rules/quarantine/connector as evidence requires. Send one unique test and verify trace plus inbox.'],['Active Directory','Account locks every few minutes.','Find DC event 4740 and caller computer. On that device check services, tasks, phones, drives and saved credentials using the old password. Fix the source and monitor for no new lockout event.'],['VMware','VM will not power on after storage alert.','Record vCenter task error. Check datastore capacity/access, VM files, snapshots, host and locks. Do not repeatedly power on. Correct the identified capacity or lock issue, then verify guest services.'],['Networking','VPN connected but no internal access.','Record assigned IP, DNS and route table. Test internal IP, hostname and required port. Compare a working user, then check split route, DNS and firewall policy. Verify the application, not only ping.']];let cur,p=+localStorage.nit_score||0,n=+localStorage.nit_attempts||0;points.textContent=p;attempts.textContent=n;function pick(){let a=cat.value==='All'?Q:Q.filter(x=>x[0]===cat.value);cur=a[Math.floor(Math.random()*a.length)];q.textContent='['+cur[0]+'] '+cur[1];ans.style.display='none';rate.innerHTML=''}next.onclick=pick;cat.onchange=pick;show.onclick=()=>{ans.innerHTML='<b>Strong answer:</b><br>'+cur[2];ans.style.display='block';rate.innerHTML='<p>Rate honestly:</p>'+[1,2,3,4,5].map(x=>'<button onclick="mark('+x+')">'+x+'</button>').join('')};window.mark=x=>{p+=x;n++;localStorage.nit_score=p;localStorage.nit_attempts=n;points.textContent=p;attempts.textContent=n;pick()};pick()</script></body></html>
