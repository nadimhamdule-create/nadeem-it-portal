<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Troubleshooting Wizard</title><style>body{font-family:Segoe UI,Arial;margin:0;background:#f3f6ff;color:#172033}.wrap{max-width:900px;margin:auto;padding:25px}.hero{background:linear-gradient(135deg,#172554,#6d28d9);color:white;padding:25px;border-radius:20px}.card{background:white;padding:20px;margin-top:16px;border:1px solid #dbe3ef;border-radius:16px}select,button{padding:11px;margin:6px;border-radius:10px;border:1px solid #cbd5e1}button{background:#4f46e5;color:white;font-weight:bold}.step{padding:12px;margin:8px;background:#f5f7ff;border-left:4px solid #6366f1}.warn{padding:12px;background:#fff8df;border:1px solid #eed17a;border-radius:9px}a{color:#4338ca}</style></head><body><div class="wrap"><p><a href="index.html">← Dashboard</a> · <a href="interview-practice.html">Interview Practice</a></p><div class="hero"><h1>🧭 Troubleshooting Wizard</h1><p>Choose the technology, symptom and affected scope. Follow the diagnostic order and record every result.</p></div><div class="card"><select id="tech"><option>Windows</option><option>Microsoft 365</option><option>Active Directory</option><option>Networking</option><option>VMware</option></select><select id="issue"></select><select id="scope"><option value="one">One user/device</option><option value="many">Multiple users/devices</option><option value="all">Entire site/company</option></select><button id="go">Build Plan</button></div><div id="out" class="card"></div></div><script>const D={Windows:['Cannot sign in','PC slow/frozen','No network','App not opening','Printer issue','Update failed'],'Microsoft 365':['Sign-in/MFA issue','Outlook disconnected','Email missing','Teams issue','OneDrive not syncing','SharePoint access denied'],'Active Directory':['Account lockout','GPO not applying','Domain trust failed','Replication issue'],Networking:['No connectivity','DNS issue','DHCP/APIPA','VPN no internal access'],VMware:['VM not starting','Host disconnected','Datastore full','vMotion failed']};function fill(){issue.innerHTML=D[tech.value].map(x=>'<option>'+x+'</option>').join('')}tech.onchange=fill;fill();go.onclick=()=>{let wide=scope.value==='one'?'Compare the affected user/device with one working example first.':'Check central service health, server/network availability and recent organization-wide changes before touching endpoints.',s=issue.value.toLowerCase(),specific=s.includes('email')?'Run Message Trace with exact sender, recipient and timestamp. Follow Delivered/Failed/Quarantined result.':s.includes('network')||s.includes('dns')||s.includes('dhcp')||s.includes('vpn')?'Check IP, gateway, DNS and routes. Test gateway, IP, hostname and required TCP port in that order.':s.includes('slow')?'Record CPU, memory, disk and top processes for five minutes; correlate with Event Viewer.':'Open the responsible admin console and logs; compare configuration with a known-good object.';let a=['Record exact error, time, last known-good state and affected scope.',wide,'Check monitoring/service health before making a change.',specific,'Apply only the correction supported by the failed check.','Repeat the original test and confirm related log/status is healthy.'];out.innerHTML='<h2>'+tech.value+' — '+issue.value+'</h2>'+a.map((x,i)=>'<div class="step"><b>Step '+(i+1)+':</b> '+x+'</div>').join('')+'<div class="warn"><b>Escalate with:</b> error, timestamp, scope, screenshots, event/correlation ID and tests completed.</div><p><a href="search.html?q='+encodeURIComponent(issue.value)+'">Open detailed matching guides →</a></p>'}</script></body></html>
